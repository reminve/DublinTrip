<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Dark background circle -->
  <circle cx="32" cy="32" r="32" fill="#020617"/>

  <!-- Shamrock leaves (3 circles) -->
  <!-- Top leaf -->
  <circle cx="32" cy="20" r="10" fill="#10b981"/>
  <!-- Bottom-left leaf -->
  <circle cx="22" cy="33" r="10" fill="#10b981"/>
  <!-- Bottom-right leaf -->
  <circle cx="42" cy="33" r="10" fill="#10b981"/>

  <!-- Center overlap fill to unite leaves -->
  <circle cx="32" cy="29" r="7" fill="#10b981"/>

  <!-- Stem -->
  <rect x="29.5" y="38" width="5" height="12" rx="2.5" fill="#10b981"/>

  <!-- Subtle inner shine on each leaf for depth -->
  <circle cx="32" cy="17" r="4" fill="#34d399" opacity="0.4"/>
  <circle cx="20" cy="31" r="4" fill="#34d399" opacity="0.4"/>
  <circle cx="44" cy="31" r="4" fill="#34d399" opacity="0.4"/>
</svg>